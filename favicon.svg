<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 二次元风格图标：粉紫夜空渐变 + 星星 + Q版动漫少女 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="12" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：夜空渐变 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 星星点缀 -->
  <path d="M11 14 l1 2.4 2.4 1 -2.4 1 -1 2.4 -1 -2.4 -2.4 -1 2.4 -1 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M52 10 l0.8 2 2 0.8 -2 0.8 -0.8 2 -0.8 -2 -2 -0.8 2 -0.8 Z" fill="#ffffff" opacity="0.85"/>
  <circle cx="55" cy="50" r="1.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="9" cy="46" r="1.1" fill="#ffffff" opacity="0.7"/>
  <circle cx="49" cy="20" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- 月牙 -->
  <path d="M50.5 40 a7 7 0 1 0 5.5 11 a8.5 8.5 0 1 1 -5.5 -11 Z" fill="#fde68a" opacity="0.95"/>

  <!-- 双马尾（后层） -->
  <ellipse cx="15.5" cy="35" rx="5" ry="8.5" fill="url(#hair)" transform="rotate(8 15.5 35)"/>
  <ellipse cx="48.5" cy="35" rx="5" ry="8.5" fill="url(#hair)" transform="rotate(-8 48.5 35)"/>

  <!-- 后层头发 -->
  <path d="M32 12 C 19 12, 14.5 24, 15.5 38 C 15.8 42, 17 45, 18.5 47 L 45.5 47 C 47 45, 48.2 42, 48.5 38 C 49.5 24, 45 12, 32 12 Z" fill="url(#hair)"/>

  <!-- 呆毛 -->
  <path d="M32 13 C 30.5 9.5, 33 7.5, 35.5 7 C 33.5 9, 33.8 10.5, 34.5 12.5" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>

  <!-- 脸 -->
  <ellipse cx="32" cy="38.5" rx="12" ry="10.5" fill="#ffe9dd"/>

  <!-- 刘海 -->
  <path d="M20.5 36 C 19.5 24, 25 18.5, 32 18.5 C 39 18.5, 44.5 24, 43.5 36 C 43 31.5, 40.5 27.5, 37.5 28.5 C 35.5 29.2, 34 27.5, 32 27.5 C 30 27.5, 28.5 29.2, 26.5 28.5 C 23.5 27.5, 21 31.5, 20.5 36 Z" fill="#b79cf7"/>

  <!-- 大眼睛（带高光） -->
  <ellipse cx="26.8" cy="38.5" rx="2.9" ry="3.7" fill="#3b3554"/>
  <circle cx="25.8" cy="37.2" r="1.05" fill="#ffffff"/>
  <circle cx="27.8" cy="40" r="0.55" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="37.2" cy="38.5" rx="2.9" ry="3.7" fill="#3b3554"/>
  <circle cx="36.2" cy="37.2" r="1.05" fill="#ffffff"/>
  <circle cx="38.2" cy="40" r="0.55" fill="#ffffff" opacity="0.85"/>

  <!-- 腮红 -->
  <ellipse cx="21.5" cy="42.5" rx="2.6" ry="1.5" fill="#fb7185" opacity="0.7"/>
  <ellipse cx="42.5" cy="42.5" rx="2.6" ry="1.5" fill="#fb7185" opacity="0.7"/>

  <!-- 微笑 -->
  <path d="M30.3 44.2 Q32 46 33.7 44.2" fill="none" stroke="#c2557a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 星星发夹 -->
  <path d="M40.5 21 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z" fill="#fde68a"/>
</svg>
